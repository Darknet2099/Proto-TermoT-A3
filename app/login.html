<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Termoterapia — Entrar</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./css/main.css">
        <script>
    try {
        const data = JSON.parse(localStorage.getItem("termoterapia-site-state-v2") || "{}");
        if (data.theme === "dark") document.documentElement.dataset.theme = "dark";
        else if (data.theme === "light") document.documentElement.dataset.theme = "light";
    } catch(e) {}
    </script>
        <style>
            .login-page-wrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 24px;
            }
            .login-split-card {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: 100%;
                max-width: 1000px;
                min-height: 600px;
                padding: 0;
                overflow: hidden;
            }
            .login-image-side {
                position: relative;
                background-image: linear-gradient(to bottom, rgba(20, 43, 67, 0.4), rgba(20, 43, 67, 0.9)), url('./img/campus-unibh.webp');
                background-size: cover;
                background-position: center;
                background-color: var(--navy);
                padding: 48px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .login-image-side .brand-icon-orange {
                display: grid;
                place-items: center;
                width: 42px;
                height: 42px;
                border-radius: 13px;
                background: #f58426;
                color: white;
                font-size: 25px;
                margin-bottom: 24px;
            }
            .login-image-side h2 {
                font-size: clamp(28px, 4vw, 36px);
                line-height: 1.15;
                margin: 0 0 16px;
                color: white;
            }
            .login-image-side p {
                font-size: 15px;
                color: #e0ecf7;
                margin: 0;
                line-height: 1.5;
                max-width: 90%;
            }

            .login-form-side {
                padding: 48px 64px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .login-form-side h1 {
                font-size: 26px;
                color: var(--navy);
                margin: 0 0 4px;
            }

            .form-group { margin-bottom: 18px; }
            .form-group label {
                display: block;
                font-size: 13px;
                font-weight: 750;
                margin-bottom: 8px;
                color: var(--navy);
            }
            .form-group input {
                width: 100%;
                border: 1.5px solid var(--border);
                border-radius: 12px;
                background: var(--bg);
                color: var(--ink);
                padding: 12px;
                font: inherit;
                transition: border-color 0.2s;
            }
            .form-group input:focus {
                outline: none;
                border-color: var(--blue);
            }

            .password-row {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .btn-icon {
                background: transparent;
                border: none;
                color: var(--muted);
                padding: 8px;
                border-radius: 9px;
                cursor: pointer;
                display: grid;
                place-items: center;
                transition: background 0.2s, color 0.2s;
            }
            .btn-icon:hover {
                background: var(--border);
                color: var(--navy);
            }

            .btn-demo {
                background: transparent; 
                border-color: var(--border); 
                color: var(--ink);
            }

            .login-links {
                display: flex;
                justify-content: center;
                gap: 4px;
                margin-top: 24px;
                font-size: 13px;
            }

            @media (max-width: 850px) {
                .login-split-card { grid-template-columns: 1fr; }
                .login-image-side { min-height: 250px; padding: 32px; }
                .login-form-side { padding: 32px; }
            }
        </style>
    </head>

    <body data-page="login">

        <main class="login-page-wrapper">
            <div class="panel login-split-card">

                <div class="login-image-side">
                    <div class="brand-icon-orange" aria-hidden="true">♨</div>
                    <h2>Termoterapia na prática.</h2>
                    <p>Consulte a literatura sobre calor e frio por condição clínica e objetivo terapêutico.</p>
                </div>

                <div class="login-form-side">
                    <h1>Entrar</h1>
                    <p class="muted small" style="margin-bottom: 32px;">Aba do fisioterapeuta</p>
                    
                    <form id="form-login">
                        <div class="form-group">
                            <label for="email">E-mail ou nome</label>
                            <input type="text" id="email" required>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 28px;">
                            <label for="senha">Senha</label>
                            <div class="password-row">
                                <input type="password" id="senha" required>
                                
                                <button type="button" class="btn-icon" id="btn-toggle-senha" title="Mostrar senha" aria-label="Mostrar senha">
                                    <svg id="icone-olho-aberto" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg id="icone-olho-fechado" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                                        <line x1="2" y1="2" x2="22" y2="22"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="button primary full" style="margin-top: 0;">Entrar</button>
                        <button type="button" id="btn-demo" class="button full btn-demo secondary" style="margin-top: 12px;">Entrar como demonstração</button>
                    </form>

                    <div class="login-links">
                        <a href="#">Esqueci minha senha</a>
                        <span class="muted">-</span>
                        <a href="#">Criar conta</a>
                    </div>
                </div>

            </div>
        </main>

        <script type="module" src="./javascript/login.js"></script>
    </body>
</html>
